services:
  postgres:
    image: postgres:16
    container_name: cineverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cineverse}
      POSTGRES_USER: ${POSTGRES_USER:-cineverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cineverse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cineverse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cineverse} -d ${POSTGRES_DB:-cineverse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: cineverse-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cineverse-postgres-data:
