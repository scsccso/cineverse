spring:
  application:
    name: cineverse-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    placeholders:
      # V2__seed_admin.sql's password_hash — this fallback is the BCrypt
      # hash for the well-known local-dev password (Admin@12345), same
      # dev-only-fallback pattern as the JWT secrets below.
      # application-prod.yml overrides this with no fallback, so a
      # production deploy fails loudly instead of shipping this password.
      adminPasswordHash: ${ADMIN_SEED_PASSWORD_HASH:$2a$10$JbfdJLYzBh/g66wDQQsb4eS22gpUvBdZXEiaZqAXCz96y.wBY8rGS}
  servlet:
    multipart:
      # Slightly above the 5MB business limit enforced in LocalStorageService,
      # so an oversized upload gets our own clean 400 instead of the servlet
      # container rejecting it first with a generic error.
      max-file-size: 6MB
      max-request-size: 6MB

server:
  # PORT, not just SERVER_PORT: most PaaS platforms (Railway, Render) inject
  # PORT and expect the process to bind to whatever value they assign, not a
  # fixed one — SERVER_PORT stays as the fallback for this project's own
  # existing local-dev convention (e.g. running a second instance side by
  # side, see docs/DEVELOPMENT.md), and 8080 is the last-resort default.
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        # Only health — the default Actuator autoconfiguration would
        # otherwise expose a much wider surface (env, beans, mappings,
        # etc.) once the starter's on the classpath; a deploy platform's
        # health check only ever needs this one.
        include: health
  endpoint:
    health:
      # Explicit, not just relying on Spring Boot's own default (which is
      # also "never") — this is a permitAll'd, unauthenticated endpoint
      # (see SecurityConfig), so it must never echo back datasource/redis
      # connection details to an anonymous caller.
      show-details: never

app:
  jwt:
    # Dev-only fallback secrets so the app boots without extra setup;
    # application-prod.yml requires these to come from the environment.
    access-secret: ${JWT_ACCESS_SECRET:dev-only-access-secret-change-me-please-32bytes-min}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-only-refresh-secret-change-me-please-32bytes-min}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  security:
    # httpOnly + secure + SameSite=Lax refresh cookie by default; secure
    # requires HTTPS, so it's turned off only in the local profile for
    # plain-HTTP dev. cookie-same-site only needs to become None (see
    # AuthController.buildCookie) when frontend/backend end up deployed on
    # two different registrable domains — application-prod.yml is where
    # that gets overridden, not here, since sharing one domain (the
    # recommended setup) doesn't need it.
    cookie-secure: true
    cookie-same-site: Lax
  cors:
    # Frontend dev server. SameSite=Strict still works cross-port here
    # because "site" is scheme+eTLD+1 (port doesn't count) — localhost:3000
    # and localhost:8080 are cross-origin but same-site. A real prod
    # deployment on two different registrable domains would need
    # SameSite=None (+ Secure) instead.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:uploads}
    base-url: /uploads
    default-poster-url: /images/no-poster.svg
    default-backdrop-url: /images/no-backdrop.svg
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  stripe:
    # No dev-only fallback here (unlike JWT secrets above) — a checkout
    # attempt without a real test-mode key should fail loudly and locally,
    # not silently call Stripe as an unauthenticated/garbage key.
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: ${STRIPE_CURRENCY:myr}
  ticket:
    # Dev-only fallback, same reasoning as the JWT secrets above — forging a
    # ticket isn't a financial exposure the way a leaked Stripe key is.
    signing-secret: ${TICKET_SIGNING_SECRET:dev-only-ticket-secret-change-me-please-32bytes-min}
  tmdb:
    # Blank default, unlike Stripe's absent one — see TmdbProperties. A
    # missing key only disables the admin movie-creation search convenience,
    # not anything a customer-facing flow depends on.
    api-key: ${TMDB_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
