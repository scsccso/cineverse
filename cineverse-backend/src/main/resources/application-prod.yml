# Production profile: no defaults on purpose — every value must come from
# the deployment environment.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  flyway:
    placeholders:
      # No fallback (unlike application.yml's base default) — see
      # V2__seed_admin.sql. Generate this hash yourself (docs/DEPLOYMENT.md
      # has the exact steps) and store only the hash in the deployment
      # platform's secret store, never the plaintext password.
      adminPasswordHash: ${ADMIN_SEED_PASSWORD_HASH}

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
  security:
    cookie-secure: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    currency: ${STRIPE_CURRENCY:myr}
  ticket:
    signing-secret: ${TICKET_SIGNING_SECRET}

logging:
  level:
    com.cineverse: INFO
