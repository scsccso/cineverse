# Local development profile: talks to the Postgres started via
# `docker-compose up -d` at the repo root (see .env.example).
spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:cineverse}
    username: ${POSTGRES_USER:cineverse}
    password: ${POSTGRES_PASSWORD:cineverse}
    driver-class-name: org.postgresql.Driver

app:
  security:
    # Local dev runs on plain HTTP; a Secure-flagged cookie would never be
    # sent back by the browser (or curl) without TLS.
    cookie-secure: false

logging:
  level:
    com.cineverse: DEBUG
    org.hibernate.SQL: DEBUG
